# ═══════════════════════════════════════════════════════════════════════════════
# APIREST-DEMO — Configuración
# Variables de entorno para producción; valores por defecto para desarrollo local
# ═══════════════════════════════════════════════════════════════════════════════

# ── Puerto del servidor ──────────────────────────────────────────────────────
# El auth.ts de Angular ya referencia localhost:8081 — mantenemos consistencia
server.port=${PORT:8081}

# ── Base de Datos PostgreSQL (Neon) ──────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-flat-brook-b5vu8mll-pooler.c-7.us-east-2.aws.neon.tech/neondb?user=neondb_owner&password=npg_z8x3kNHyoPiq&sslmode=require&channelBinding=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_z8x3kNHyoPiq}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Hibernate / JPA ──────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ── CORS ─────────────────────────────────────────────────────────────────────
# En desarrollo: http://localhost:4200
# En producción: URL pública del frontend (Netlify, Vercel, etc.)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200}